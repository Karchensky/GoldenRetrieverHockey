# The goals of our games — ours and the other team's — clipped onto the box
# scores, daily.
#
# Runs when the morning's refresh finishes — the refresh is what brings in last
# night's scoresheet. On a day with no new goal it reads three files, finds
# nothing to do and stops: no install, no sign-in, about ten seconds.
#
# On a day with one, it signs in to the rink's video site as the account owner,
# finds the game and reads its recording for the goals, and cuts the seconds
# around each goal straight from that recording — asking the rink for nothing
# and spending nothing. A cut clip is checked twice before it goes anywhere:
# its own scoreboard must show the goal going in at the score either side of
# it, and it must match, frame by frame, the stretch of the recording it was
# cut from, with the goal where the search put it. Then it is encoded for the
# web and put in the grh-highlights R2 bucket.
#
# The rink's own downloads are still there, by hand: run with source "auto" or
# "download", a clip of one of OUR goals is marked and the rink asked to render
# it — ONE OF THE ACCOUNT'S 20 DOWNLOADS A MONTH EACH (the platform calls them
# credits), two goals sharing one when they fit in a minute. A goal against is
# never a download. The rink takes a few minutes per clip; one still rendering
# after 25 minutes is collected by the next run.
#
# Once a game's goals are searched it also makes the game's RECAP: its goals,
# both teams', its penalties, its shots on goal where the board counts them,
# the plays its whistles in a zone ended and the chances the camera followed,
# cut from the recording into a few minutes of video (apps/web/data/recaps.json). No
# download is spent on it. One goal found is enough, and a 0–0 game gets
# one; a game with none of its goals found gets none, reported once in the
# ledger's "recap" — delete that to have it tried again. A corrected
# scoresheet makes it again, and so does a
# new RECAP_EDITION, three games a daily run and all of them on a look back.
#
# Run by hand, it asks where clips come from: "recording", the daily run's
# (never a download), "auto" (the rink's downloads while the month's last,
# then the recording) or "download" (never the recording: with none left a
# clip waits for next month). And, optionally, a date to look
# back from: the one-time look at games before this season, which are only ever
# cut from the recording. The look back has six hours, not two.
#
# Kept apart from the refresh deliberately: different secrets, a long wait on
# the rink, and nothing it does can ever cost a day's data capture. Nothing it
# does can take a page down either: the box score shows a clip only once the
# clip is uploaded.
#
# RED means something for a person, said once in the log's PROBLEM lines; the
# ledger (packages/highlights/ledger.json) remembers it, so the next run is
# green and does not repeat it. Most are cleared by editing the ledger on main:
#   - a game "not found", "no recording" or with a goal it could not pin down:
#     the game's "problem" — delete it (and "sheet") to have it looked at again.
#     A corrected scoresheet does this by itself.
#   - a clip that failed its checks: its "status" is "failed". The download is
#     used, but while the rink still has the download, setting it back to
#     "requested" (and deleting any "tries") re-checks that same download for
#     nothing. Never set one to "queued" unless it should use another download
#     — or, run by hand with source "recording", be cut again for nothing.
#     Its "source" says which it was.
# Red every day is a different thing: the sign-in failing (the password, or the
# subscription ended) or the rink's site changed. To stop it for good, disable
# this workflow; the clips already up stay up.
#
# THE LOGS ARE PUBLIC. The job prints game ids, goals and counts — never a
# token, the recording's address or a clip's download link.

name: Goal highlights

on:
  workflow_run:
    workflows: ["Refresh current season"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source:
        description: "Where clips come from"
        type: choice
        options: [recording, auto, download]
        default: recording
      since:
        description: "Look back to this date, YYYY-MM-DD, once (older games are cut from the recording). Empty: this season."
        type: string
        default: ""

# The same group as the refresh: one job pushing to main at a time.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  checks: read

jobs:
  highlights:
    runs-on: ubuntu-latest
    # Two hours a day: a recap reads the whole recording, ten to thirty minutes a game, after the goals.
    # A look back gets the most a job may have. One that runs out still commits what it finished — the
    # job writes its files when it is stopped — and running it again carries on from there.
    timeout-minutes: ${{ inputs.since && 355 || 120 }}

    steps:
      # main, not the SHA that triggered this: the refresh has just pushed to it.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # From the files alone, with nothing installed: is there a goal to clip, a
      # clip to collect, a recap to make, or a corrected scoresheet to report?
      - name: Anything to do?
        id: check
        env:
          SINCE: ${{ inputs.since }}
        run: node packages/highlights/src/cli.ts daily --check ${SINCE:+--since "$SINCE"}

      - if: steps.check.outputs.work == 'true'
        run: npm ci

      - name: Install ffmpeg
        if: steps.check.outputs.work == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Red only for a NEW problem — a goal it could not pin down, a clip that
      # failed its check — and the email that turns red is the notification.
      # The ledger records it, so the next run does not search that game again.
      - name: Clip the goals
        if: steps.check.outputs.work == 'true'
        env:
          HARBORCENTER_EMAIL: ${{ secrets.HARBORCENTER_EMAIL }}
          HARBORCENTER_PASSWORD: ${{ secrets.HARBORCENTER_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE: ${{ inputs.source || 'recording' }}
          SINCE: ${{ inputs.since }}
        run: node packages/highlights/src/cli.ts daily --source "$SOURCE" ${SINCE:+--since "$SINCE"}

      # Always, red or green: the ledger is what the job spent and asked for, and
      # losing it would leave tomorrow's run not knowing.
      - name: Commit
        id: commit
        if: always() && steps.check.outputs.work == 'true'
        run: |
          if [ -z "$(git status --porcelain -- apps/web/data/highlights.json apps/web/data/recaps.json packages/highlights/ledger.json)" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/data/highlights.json apps/web/data/recaps.json packages/highlights/ledger.json
          git commit -m "chore(highlights): goal clips

          Clipped from the rink's recording, checked against the scoresheet
          and uploaded by the scheduled job."
          git push || (git pull --rebase && git push)
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # After the push, as the refresh does: a failure here is reported, the
      # ledger is already safe.
      - name: Check the build still succeeds
        if: always() && steps.commit.outputs.pushed == 'true'
        run: npm run build:site

      - name: Check the suite still passes
        if: always() && steps.commit.outputs.pushed == 'true'
        run: npm test

      - name: Verify Cloudflare deployment
        if: always() && steps.commit.outputs.pushed == 'true'
        timeout-minutes: 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-deployment.ts
