# Our goals, clipped onto the box scores, daily.
#
# Runs when the morning's refresh finishes — the refresh is what brings in last
# night's scoresheet. On a day with no new goal of ours it reads three files,
# finds nothing to do and stops: no install, no sign-in, about ten seconds.
#
# On a day with one, it signs in to the rink's video site as the account owner,
# finds the game and reads its recording for the goals, marks a clip of each of
# OURS and asks the rink to render it — ONE OF THE ACCOUNT'S 20 DOWNLOADS A
# MONTH EACH (the platform calls them credits), two goals sharing one when they
# fit in a minute. With none left, the clip is cut from the recording instead
# — THE BACKUP: the job already reads the recording to find the goals, so it
# keeps the seconds around the goal and spends nothing. A rendered clip is checked twice before
# it goes anywhere, and so is a cut one: its own scoreboard must show the goal going in at the score
# either side of it, and it must match, frame by frame, the stretch of the
# recording it was asked for, with the goal where the search put it. Then it is
# encoded for the web and put in the grh-highlights R2 bucket. The rink takes a
# few minutes per clip; one still rendering after 25 minutes is collected by
# tomorrow's run.
#
# Run by hand, it asks where clips come from: "auto", the daily run's (the
# rink's downloads while the month's last, then the recording), "download"
# (never the recording: with none left a clip waits for next month, as before
# the backup) or "recording" (never a download). And, optionally, a date to look
# back from: the one-time look at games before this season, which are only ever
# cut from the recording. The look back has five hours, not one.
#
# Kept apart from the refresh deliberately: different secrets, a long wait on
# the rink, and nothing it does can ever cost a day's data capture. Nothing it
# does can take a page down either: the box score shows a clip only once the
# clip is uploaded.
#
# RED means something for a person, said once in the log's PROBLEM lines; the
# ledger (packages/highlights/ledger.json) remembers it, so the next run is
# green and does not repeat it. Most are cleared by editing the ledger on main:
#   - a game "not found", "no recording" or with a goal it could not pin down:
#     the game's "problem" — delete it (and "sheet") to have it looked at again.
#     A corrected scoresheet does this by itself.
#   - a clip that failed its checks: its "status" is "failed". The download is
#     used, but while the rink still has the download, setting it back to
#     "requested" (and deleting any "tries") re-checks that same download for
#     nothing. Never set one to "queued" unless it should use another download
#     — or, run by hand with source "recording", be cut again for nothing.
#     Its "source" says which it was.
# Red every day is a different thing: the sign-in failing (the password, or the
# subscription ended) or the rink's site changed. To stop it for good, disable
# this workflow; the clips already up stay up.
#
# THE LOGS ARE PUBLIC. The job prints game ids, goals and counts — never a
# token, the recording's address or a clip's download link.

name: Goal highlights

on:
  workflow_run:
    workflows: ["Refresh current season"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source:
        description: "Where clips come from"
        type: choice
        options: [auto, download, recording]
        default: auto
      since:
        description: "Look back to this date, YYYY-MM-DD, once (older games are cut from the recording). Empty: this season."
        type: string
        default: ""

# The same group as the refresh: one job pushing to main at a time.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  checks: read

jobs:
  highlights:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.since && 300 || 60 }}

    steps:
      # main, not the SHA that triggered this: the refresh has just pushed to it.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # From the files alone, with nothing installed: is there a goal of ours to
      # clip, a clip to collect, or a corrected scoresheet to report?
      - name: Anything to do?
        id: check
        env:
          SINCE: ${{ inputs.since }}
        run: node packages/highlights/src/cli.ts daily --check ${SINCE:+--since "$SINCE"}

      - if: steps.check.outputs.work == 'true'
        run: npm ci

      - name: Install ffmpeg
        if: steps.check.outputs.work == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Red only for a NEW problem — a goal it could not pin down, a clip that
      # failed its check — and the email that turns red is the notification.
      # The ledger records it, so the next run does not search that game again.
      - name: Clip our goals
        if: steps.check.outputs.work == 'true'
        env:
          HARBORCENTER_EMAIL: ${{ secrets.HARBORCENTER_EMAIL }}
          HARBORCENTER_PASSWORD: ${{ secrets.HARBORCENTER_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE: ${{ inputs.source || 'auto' }}
          SINCE: ${{ inputs.since }}
        run: node packages/highlights/src/cli.ts daily --source "$SOURCE" ${SINCE:+--since "$SINCE"}

      # Always, red or green: the ledger is what the job spent and asked for, and
      # losing it would leave tomorrow's run not knowing.
      - name: Commit
        id: commit
        if: always() && steps.check.outputs.work == 'true'
        run: |
          if [ -z "$(git status --porcelain -- apps/web/data/highlights.json packages/highlights/ledger.json)" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/data/highlights.json packages/highlights/ledger.json
          git commit -m "chore(highlights): goal clips

          Clipped from the rink's recording, checked against the scoresheet
          and uploaded by the scheduled job."
          git push || (git pull --rebase && git push)
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # After the push, as the refresh does: a failure here is reported, the
      # ledger is already safe.
      - name: Check the build still succeeds
        if: always() && steps.commit.outputs.pushed == 'true'
        run: npm run build:site

      - name: Check the suite still passes
        if: always() && steps.commit.outputs.pushed == 'true'
        run: npm test

      - name: Verify Cloudflare deployment
        if: always() && steps.commit.outputs.pushed == 'true'
        timeout-minutes: 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-deployment.ts
